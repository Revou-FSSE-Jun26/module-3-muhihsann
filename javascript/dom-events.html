<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Exercise — DOM & Events</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1c1917;
      background: #fafaf9;
    }
    h1 { font-size: 1.4rem; }
    section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background: #d97706;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #64748b; }
    button:hover { filter: brightness(0.95); }

    /* Class toggled by JS */
    .box {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 8px;
      background: #e2e8f0;
      transition: background 0.2s, color 0.2s;
    }
    .box.active {
      background: #d97706;
      color: #fff;
    }

    input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }
    ul { padding-left: 1.25rem; }
    li { margin: 0.25rem 0; display: flex; align-items: center; gap: 0.5rem; }
    li button { background: #ef4444; padding: 0.2rem 0.5rem; font-size: 0.8rem; }
    #counter-value { font-weight: 700; font-size: 1.25rem; }
  </style>
</head>
<body>
  <h1>DOM Manipulation &amp; Event Handling</h1>

  <!-- 1. Select + update an element, toggle a class -->
  <section>
    <h2>1. Toggle a class</h2>
    <button id="toggle-btn">Toggle highlight</button>
    <div id="box" class="box">Click the button to toggle my <code>.active</code> class.</div>
  </section>

  <!-- 2. Counter — update text content on click -->
  <section>
    <h2>2. Counter (update DOM text)</h2>
    <button id="decrement" class="secondary">-</button>
    <span id="counter-value">0</span>
    <button id="increment">+</button>
  </section>

  <!-- 3. Create + remove elements from a list -->
  <section>
    <h2>3. Create &amp; remove elements</h2>
    <form id="item-form">
      <input type="text" id="item-input" placeholder="Add an item..." />
      <button type="submit">Add</button>
    </form>
    <ul id="item-list"></ul>
  </section>

  <script src="dom-events.js"></script>
</body>
</html>
